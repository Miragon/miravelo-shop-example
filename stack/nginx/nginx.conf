server {
    listen 80;
    server_name localhost;

    # Docker's internal DNS – resolves container names per-request instead of at startup
    resolver 127.0.0.11 valid=10s;

    location /health {
        access_log off;
        return 200 'ok';
    }

    location /auth/ {
        proxy_pass http://keycloak:8080/auth/;
        proxy_set_header Host $host:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 8080;
    }

    location /api/ {
        # Literal proxy_pass so the name is resolved via the OS resolver (which reads
        # /etc/hosts). host.docker.internal is injected there by extra_hosts:host-gateway
        # on Linux; Docker's embedded DNS (127.0.0.11) does NOT serve it, so a variable
        # proxy_pass + resolver would 502 on a Linux CI runner.
        proxy_pass http://host.docker.internal:8081;
        proxy_set_header Host $host:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 8080;
    }

    location / {
        # Literal proxy_pass — see the /api/ block above for why a variable + resolver
        # breaks on a Linux CI runner.
        proxy_pass http://host.docker.internal:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 8080;
    }
}
